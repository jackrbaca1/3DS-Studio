[[permission]]
identifier = "allow-studio-commands"
description = "Allow 3DS Studio editor IPC commands"
commands.allow = [
  "pick_directory",
  "pick_file",
  "check_toolchain",
  "get_toolchain_status",
  "set_toolchain_path",
  "open_external_url",
  "create_project",
  "ensure_example_project",
  "list_studio_projects",
  "rename_studio_project",
  "delete_studio_project",
  "save_project_as",
  "create_named_project",
  "save_config",
  "compile_project",
  "compile_project_cia",
  "clean_project",
  "run_3dslink",
  "open_project_folder",
  "import_asset",
  "write_levels",
  "save_project_json",
  "load_project_json",
  "project_exists",
  "read_text_file",
  "read_binary_file",
  "inspect_project",
  "load_project_config",
  "ensure_studio_integration",
  "get_asset_status",
  "get_asset_specs",
]
