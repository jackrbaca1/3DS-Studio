[package]
name = "studio3ds"
version = "0.1.0"
description = "3DS Studio — Platformer Editor"
authors = ["3DS Studio"]
edition = "2021"

[lib]
name = "studio3ds_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
